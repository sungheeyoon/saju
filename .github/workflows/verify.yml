name: verify

on:
  # **기능 브랜치 푸시에서는 안 돈다.**
  #
  # 트리거 둘에 필터가 없으면 브랜치를 밀 때 한 번, PR 을 열 때 또 한 번 — 같은 커밋에
  # 비싼 검증이 **두 벌** 돈다. 검증이 서야 하는 자리는 **PR 과 main** 둘이고, 그 둘이면
  # 머지 전과 머지 뒤가 다 덮인다.
  push:
    branches: [main]
  pull_request:
  # 하루 한 번 전부 돈다 — 선택 실행이 건너뛴 자리가 하루 이상 안 재어지는 일이 없게.
  schedule:
    - cron: '0 20 * * *' # 05:00 KST
  workflow_dispatch:

# PR 가지에 새 커밋이 오면 대체된 실행을 끊는다. force-push 뒤 옛 실행이 끝까지 도는
# 낭비가 사라진다. 벽시계는 안 준다.
#
# **main 푸시는 끊지 않는다.** main 에 드는 커밋은 곧 배포이고, 이 실행이 그 뒤의 검증이다.
# 2026-09-23 에 여러 세션이 연달아 머지하자 main 실행 넷이 다음 푸시에 끊겼다. 그룹을
# 커밋마다 따로 두는 까닭은 `cancel-in-progress: false` 로도 **기다리던 실행은 새 실행에
# 밀려 취소되기** 때문이다. 머지 전의 검증은 보호 규칙의 strict 가 든다(ADR 0082 추기).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 무엇을 돌릴지 — **판단은 `scripts/ci-plan.mjs` 한 곳에 있다** (ADR 0082)
  # ---------------------------------------------------------------------------
  #
  # YAML 의 `paths` 필터를 안 쓴다. 필터로 건너뛴 job 은 필수 검사에서 「기다리는 중」으로
  # 영원히 남아 머지를 막는다. 여기서 낸 답을 아래 job 들이 `if` 로 읽고, `gate` 가
  # `skipped` 를 통과로 센다. main 푸시·일정·손으로 켠 실행은 계획을 안 보고 전부 돈다.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      authed: ${{ steps.plan.outputs.authed }}
      flow: ${{ steps.plan.outputs.flow }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 이 바꾼 파일을 base 와의 merge-base 로 셈하려면 main 의 역사가 있어야 한다.
          # 저장소가 19MB 라 통째로 받아도 몇 초다.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ]; then
            # 이름 바뀐 파일은 옛 이름·새 이름 둘 다 선다 — 지운 파일도 「바뀐 파일」이다.
            files=$(git diff --name-only --no-renames "origin/$BASE...HEAD")
          fi
          printf '%s\n' "$files" | node scripts/ci-plan.mjs --event "$EVENT" --labels "$LABELS"

  # ---------------------------------------------------------------------------
  # 단위·타입·린트·빌드 + 익명 e2e — **살아 있는 Supabase 없이** 잰다
  # ---------------------------------------------------------------------------
  verify:
    needs: plan
    if: needs.plan.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # **버전을 여기 적지 않는다**(`.nvmrc`). CI 가 20 에 고정돼 있는 동안 개발
          # 기계는 24 였고, 그 차이는 `verify` 가 realtime client 를 안 만들어서 여태
          # 안 드러났다 — `authed` 를 세우자 첫 실행에서 68건이 「Node.js detected but
          # native WebSocket not found」로 죽었다(전역 `WebSocket` 은 Node 22부터다).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # 껍데기 값이다. 로그인하지 않은 사람을 돌려보내는 데 살아 있는 Supabase 가
          # 필요하면 그것부터 잘못이므로, 이 job 은 일부러 붙지 않은 채로 잰다.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  # ---------------------------------------------------------------------------
  # 로그인 뒤 화면 — **살아 있는 Supabase 를 세워서 잰다** (ADR 0050), 차선 넷이 나란히
  # ---------------------------------------------------------------------------
  #
  # 이 job 이 없던 동안 로그인 뒤 화면 74개 시험을 **아무도 안 밟았다.** CI 는 익명만
  # 돌렸고, 로컬은 `reuseExistingServer` 가 원격을 보는 dev 서버를 재사용해서 전부
  # 로그인 화면을 받았다. 사람이 「배포 전에 손으로 돌린다」로 두었던 자리이고, 손으로
  # 하는 일은 안 하는 날이 온다.
  #
  # 실제 로그인은 **몰지 않는다** — 구글 화면은 남의 것이다. `e2e/session.ts` 가 로컬
  # 스택에 계정을 만들고 가입 관문은 그대로 지난다(ADR 0042).
  #
  # **차선마다 제 스택을 띄운다.** 한 job 에서 `--workers=1` 로 106건을 직렬로 돌리던
  # 6분이 이 워크플로의 병목이었다. 그런데 공유 러너에서는 워커를 늘려도 거의 안 준다
  # (signed-in 76건이 1·2·4 워커에서 3.0·2.7·2.9분 — ADR 0082). 느린 것은 시험이
  # 아니라 dev 서버라서, 줄이는 길은 **서버를 여럿 세우는 것**이다. 그래서 데스크톱과
  # 모바일을 스택째 가른다. 궁합은 그 위에 한 워커다 — `onlyTheseParticipate` 가 전역
  # 참여 표를 제 쌍으로 좁혀 두 워커면 7건이 죽는다. 안내 관문은 전역 일정 표를 두고
  # 다투므로 혼자 돈다.
  authed:
    needs: plan
    if: needs.plan.outputs.authed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: authed (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ['signed-in:desktop', 'signed-in:mobile', 'match:desktop', 'match:mobile', 'chat:desktop', 'chat:mobile', notice]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # CLI 는 devDependency 다 — `npm ci` 가 이미 놓았다. 안 쓰는 서비스는 빼고 띄운다
      # (`db:start`). 이 job 이 재는 것에 realtime·storage·studio 는 안 든다.
      - run: npm run db:start

      # **표 검사가 e2e 보다 먼저다 — 순서가 뜻을 갖는다.**
      #
      # pgTAP 은 표를 전역으로 세는 자리가 있어서(「얼린 입력이 0개인가」·「후보로
      # 서는가」) **먼저 만들어진 남의 행에 걸린다.** 로컬에서 이것이 빨간불이었고
      # 원인이 e2e 가 남긴 계정이었다 — `supabase db reset` 뒤에 669건이 다 통과했다.
      # 뒤에 두면 CI 에서도 같은 오염을 만든다. 차선 넷 중 가장 짧은 `notice` 에만 둔다.
      #
      # **생성 타입은 마이그레이션과 함께 움직인다.**
      #
      # `Database` 가 앱이 아는 DB 의 모양 전부다(ADR 0078). 마이그레이션만 고치고 이
      # 파일을 안 다시 지으면 앱은 **없는 열을 있다고 믿은 채로** 컴파일된다 — 그때
      # 빨개지는 자리가 없다. 여기서 다시 지어 보고 diff 가 남으면 세운다. `gen types` 는
      # 살아 있는 스택이 필요하고, 그것을 띄우는 곳은 `db:start` 를 부르는 여기뿐이다.
      - if: matrix.lane == 'notice'
        run: npm run db:types
      - if: matrix.lane == 'notice'
        run: git diff --exit-code src/lib/db/database.generated.ts
      - if: matrix.lane == 'notice'
        run: npm run test:db

      # `reuseExistingServer` 는 `CI` 에서 꺼지므로 Playwright 가 제 서버를 띄우고,
      # 그때 `webServer.env` 가 로컬 스택 값을 덮는다 — 원격에 닿을 자리가 없다.
      - run: npm run test:e2e:${{ matrix.lane }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authed-playwright-report-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        run: npm run db:stop

  # ---------------------------------------------------------------------------
  # 흐름 검사 일곱 벌 — RPC 로 동의하고 화면을 두드린다, 모델은 안 부른다
  # ---------------------------------------------------------------------------
  #
  # 검사들은 서버 액션을 한 번도 안 누르고(POST 0건) RPC 로 동의하므로 모델로 가는
  # 유일한 길을 지나지 않고, 지나더라도 `next start` 는 열쇠가 든
  # `.env.development.local` 을 안 읽는다. 필요한 것은 Docker 하나다. 제 서버를
  # `.next-check` 에 따로 짓는다(`scripts/next-server.mjs`).
  flow:
    needs: plan
    if: needs.plan.outputs.flow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run test:flow
      - if: always()
        run: npm run db:stop

  # ---------------------------------------------------------------------------
  # 필수 검사는 **이것 하나** — 건너뛴 차선은 통과, 실패·취소는 실패
  # ---------------------------------------------------------------------------
  #
  # GitHub 의 필수 검사는 안 돈 job 을 「기다리는 중」으로 영원히 둔다. 선택으로 건너뛴
  # job 을 필수로 걸면 머지가 막힌다. 그래서 `gate` 는 항상 돌고, 위 job 전부를 물린다.
  # main 보호 규칙의 필수 검사는 `gate` 하나다 — 그래서 `gh pr merge --auto` 가 기다린다.
  gate:
    needs: [plan, verify, authed, flow]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo '::error::차선 하나가 실패했거나 끊겼다'
          exit 1
      - run: echo "전부 통과했거나 계획대로 건너뛰었다"
