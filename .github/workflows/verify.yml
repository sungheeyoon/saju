name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # 껍데기 값이다. 로그인하지 않은 사람을 돌려보내는 데 살아 있는 Supabase 가
          # 필요하면 그것부터 잘못이므로, 이 job 은 일부러 붙지 않은 채로 잰다.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  # ---------------------------------------------------------------------------
  # 로그인 뒤 화면 — **살아 있는 Supabase 를 세워서 잰다** (ADR 0050)
  # ---------------------------------------------------------------------------
  #
  # 이 job 이 없던 동안 로그인 뒤 화면 74개 시험을 **아무도 안 밟았다.** CI 는 익명만
  # 돌렸고, 로컬은 `reuseExistingServer` 가 원격을 보는 dev 서버를 재사용해서 전부
  # 로그인 화면을 받았다. 사람이 「배포 전에 손으로 돌린다」로 두었던 자리이고, 손으로
  # 하는 일은 안 하는 날이 온다.
  #
  # 실제 로그인은 **몰지 않는다** — 구글 화면은 남의 것이다. `e2e/session.ts` 가 로컬
  # 스택에 계정을 만들고 가입 관문은 그대로 지난다(ADR 0042).
  #
  # `test:flow` 는 아직 여기서 안 돈다 — 모델을 실제로 부르므로 push 마다 돌 일이
  # 아니다. **이 워크플로가 초록이어도 「전부 통과」는 아직 아니다.**
  authed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # CLI 는 devDependency 다 — `npm ci` 가 이미 놓았다. 안 쓰는 서비스는 빼고 띄운다
      # (`db:start`). 이 job 이 재는 것에 realtime·storage·studio 는 안 든다.
      - run: npm run db:start

      # **표 검사가 e2e 보다 먼저다 — 순서가 뜻을 갖는다.**
      #
      # pgTAP 은 표를 전역으로 세는 자리가 있어서(「얼린 입력이 0개인가」·「후보로
      # 서는가」) **먼저 만들어진 남의 행에 걸린다.** 로컬에서 이것이 빨간불이었고
      # 원인이 e2e 가 남긴 계정이었다 — `supabase db reset` 뒤에 669건이 다 통과했다.
      # 뒤에 두면 CI 에서도 같은 오염을 만든다.
      - run: npm run test:db

      # `reuseExistingServer` 는 `CI` 에서 꺼지므로 Playwright 가 제 서버를 띄우고,
      # 그때 `webServer.env` 가 로컬 스택 값을 덮는다 — 원격에 닿을 자리가 없다.
      - run: npm run test:e2e:authed

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authed-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        run: npm run db:stop
