name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

      # DB·flow·로그인 검사는 여기서 안 돈다. 살아 있는 Supabase 가 필요하고, CI 에
      # 그 스택을 세우는 것은 이 워크플로가 하던 일보다 큰 변경이다. **그래서 이
      # 워크플로가 초록이어도 「전부 통과」는 아니다** — 배포 전에는 손으로 돌린다:
      #   npm run test:db && npm run test:flow && npm run test:e2e:authed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # 껍데기 값이다. 로그인하지 않은 사람을 돌려보내는 데 살아 있는 Supabase 가
          # 필요하면 그것부터 잘못이므로, CI 는 일부러 붙지 않은 채로 잰다. 실제 로그인은
          # 남의 화면(구글)을 지나가므로 여기서 몰지 않는다.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
